spring.application.name=wordle
spring.profiles.active=dev

# JWT signing secret (override JWT_SECRET in production)
wordle.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdefghijklmnopqrstuvwxyz}
wordle.jwt.expiry-hours=${JWT_EXPIRY_HOURS:168}

# Admin username promoted to ADMIN role (override ADMIN_USERNAME in production)
wordle.admin-username=${ADMIN_USERNAME:admin}

# Max reveals of the daily word per user per day
wordle.reveal-daily-limit=${REVEAL_DAILY_LIMIT:5}

# Allowed CORS origins (comma separated). Empty = same-origin only.
wordle.cors.origins=${ALLOWED_ORIGINS:}